name: Build Webflasher & Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: webflasher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_new_release: ${{ steps.meta.outputs.is_new_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware (esp32-s3-n8r8)
        run: pio run -e esp32-s3-n8r8

      - name: Prepare flash images (factory + firmware + Pages)
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ENV=esp32-s3-n8r8
          BUILD_DIR=".pio/build/${ENV}"
          OUT_DIR="IMGs"
          mkdir -p "$OUT_DIR"

          chmod +x scripts/read_version.sh
          VERSION="$(./scripts/read_version.sh)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Firmware-Version: ${VERSION}"
          export FW_VERSION="${VERSION}"

          TAG="v${VERSION}"
          IS_NEW=0
          if [[ "${{ github.event_name }}" == "push" && ( "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" ) ]]; then
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              IS_NEW=1
            fi
          fi
          echo "is_new_release=${IS_NEW}" >> "$GITHUB_OUTPUT"
          echo "Release-Tag ${TAG}: neu=${IS_NEW}"

          BOOT_APP0="$(find ~/.platformio/packages -name 'boot_app0.bin' | head -n1)"
          if [ -z "$BOOT_APP0" ]; then
            echo "boot_app0.bin nicht gefunden" >&2
            exit 1
          fi

          cp "$BUILD_DIR/firmware.bin" "$OUT_DIR/firmware.bin"
          cp "$BUILD_DIR/bootloader.bin" "$OUT_DIR/bootloader.bin"
          cp "$BUILD_DIR/partitions.bin" "$OUT_DIR/partitions.bin"
          cp "$BOOT_APP0" "$OUT_DIR/boot_app0.bin"

          pip install -q esptool
          python -m esptool --chip esp32s3 merge_bin \
            -o "$OUT_DIR/factory.bin" \
            --flash_mode qio --flash_freq 80m --flash_size 8MB \
            0x0 "$BUILD_DIR/bootloader.bin" \
            0x8000 "$BUILD_DIR/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$BUILD_DIR/firmware.bin"

          python3 <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ["FW_VERSION"]
          data = {
              "name": "Rotor DK8DE",
              "version": version,
              "new_install_prompt_erase": True,
              "builds": [
                  {
                      "chipFamily": "ESP32-S3",
                      "parts": [{"path": "factory.bin", "offset": 0}],
                  }
              ],
          }
          Path("IMGs/manifest.json").write_text(
              json.dumps(data, indent=2) + "\n", encoding="utf-8"
          )
          readme = "\n".join([
              f"Rotor DK8DE Firmware {version}",
              "",
              "factory.bin  - Komplettflash ab Adresse 0 (USB-Webflasher / esptool)",
              "firmware.bin - nur App fuer SoftAP-OTA (Web-Tab Update)",
              "",
              "USB-Webflasher:",
              "  https://dk8de.github.io/Rotor_Firmware/",
              "",
              "SoftAP-OTA:",
              "  SETWLAN:1 -> http://192.168.4.1 (admin / Rotorconfig) -> Update -> firmware.bin",
              "",
              "Beispiel Komplettflash:",
              "  esptool.py --chip esp32s3 write_flash 0x0 factory.bin",
              "",
          ])
          Path("IMGs/README.txt").write_text(readme, encoding="utf-8")
          PY

          cp "$OUT_DIR/factory.bin" "$OUT_DIR/Rotor-${VERSION}-factory.bin"
          cp "$OUT_DIR/firmware.bin" "$OUT_DIR/Rotor-${VERSION}-firmware.bin"

          rm -rf site
          mkdir -p site/IMGs
          cp webflasher/index.html site/index.html
          cp "$OUT_DIR/factory.bin" "$OUT_DIR/firmware.bin" "$OUT_DIR/manifest.json" site/IMGs/
          ls -la IMGs site/IMGs

      - name: Upload flash binaries (artifact)
        uses: actions/upload-artifact@v6
        with:
          name: Rotor-${{ steps.meta.outputs.version }}
          path: |
            IMGs/factory.bin
            IMGs/firmware.bin
            IMGs/manifest.json
            IMGs/README.txt
            IMGs/Rotor-${{ steps.meta.outputs.version }}-factory.bin
            IMGs/Rotor-${{ steps.meta.outputs.version }}-firmware.bin
            IMGs/bootloader.bin
            IMGs/partitions.bin
            IMGs/boot_app0.bin
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release (nur bei neuer Version)
        if: steps.meta.outputs.is_new_release == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="v${VERSION}"
          NOTES=$(cat <<NOTES_EOF
          Firmware ${VERSION} aus \`src/Version.h\`.

          - \`Rotor-${VERSION}-factory.bin\` – Komplettflash ab 0x0 (USB-Webflasher / Erstinstallation)
          - \`Rotor-${VERSION}-firmware.bin\` – SoftAP-OTA (App, Tab Update)
          - \`README.txt\` – Kurzhilfe

          USB-Webflasher: https://dk8de.github.io/Rotor_Firmware/

          SoftAP-OTA: \`SETWLAN:1\` → http://192.168.4.1 (admin / Rotorconfig) → Update → nur firmware.bin
          NOTES_EOF
          )
          # führende Einrückung der Heredoc-Zeilen entfernen
          NOTES="$(printf '%s\n' "$NOTES" | sed 's/^[[:space:]]*//')"
          gh release create "$TAG" \
            --title "Rotor DK8DE ${VERSION}" \
            --notes "$NOTES" \
            "IMGs/Rotor-${VERSION}-factory.bin" \
            "IMGs/Rotor-${VERSION}-firmware.bin" \
            "IMGs/README.txt"

      - name: Upload Pages artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-pages:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
